<p-dialog
  header="Confirm Delete"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '350px' }"
>
  <p class="m-0">
    Are you sure you want to delete this patient?
  </p>

  <ng-template pTemplate="footer">
    <div class="flex justify-content-end gap-2">
      <button
        pButton
        label="Cancel"
        class="p-button-text"
        (click)="visible = false"
      ></button>

      <button
        pButton
        label="Delete"
        icon="pi pi-trash"
        class="p-button-danger"
        (click)="confirm()"
      ></button>
    </div>
  </ng-template>
</p-dialog>
