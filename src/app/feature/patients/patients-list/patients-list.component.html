<div class="p-4">
  <p-card>
    <div class="flex justify-content-between align-items-center mb-3">
      <h2 class="m-0">Patients</h2>

      <button
        pButton
        label="Add Patient"
        icon="pi pi-plus"
        class="p-button-primary"
        routerLink="new"
      ></button>
    </div>

    <p-table
      [value]="patients"
      responsiveLayout="scroll"
      [paginator]="true"
      [rows]="5"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>Gender</th>
          <th>Phone</th>
          <th>Email</th>
          <th style="width: 160px">Actions</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-patient>
        <tr>
          <td>{{ patient.name }}</td>
          <td>{{ patient.age }}</td>
          <td>{{ patient.gender }}</td>
          <td>{{ patient.phone }}</td>
          <td>{{ patient.email }}</td>

          <td>
            <div class="flex gap-2">
              <button
                pButton
                icon="pi pi-eye"
                class="p-button-rounded p-button-text"
                [routerLink]="patient.id.toString()"
              ></button>

              <button
                pButton
                icon="pi pi-pencil"
                class="p-button-rounded p-button-text p-button-warning"
                [routerLink]="patient.id + '/edit'"
              ></button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="text-center p-4">
            No patients found
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
